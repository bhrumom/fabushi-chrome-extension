name: Chrome extension

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate manifest and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./chatgpt-vps-control/chrome-platform/extension/manifest.json').version")"
          test "$version" = "0.7.0"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find chatgpt-vps-control/chrome-platform/extension -type f -name '*.js' -print0)

      - name: Validate Grok Chrome parity inventory
        run: node scripts/check-grok-chrome-parity-ledger.mjs

      - name: Test Agent protocol and architecture boundaries
        run: node --test chatgpt-vps-control/tests/agent-protocol.test.mjs chatgpt-vps-control/tests/coordinator-transports.test.mjs chatgpt-vps-control/tests/remote-coordinator.test.mjs chatgpt-vps-control/tests/browser-runner.test.mjs chatgpt-vps-control/tests/grok-chrome-architecture.test.mjs chatgpt-vps-control/tests/agent-product.test.mjs

      - name: Test preserved Chrome capabilities
        run: node --test chatgpt-vps-control/tests/preserved-capabilities.test.mjs chatgpt-vps-control/tests/host-resilience.test.mjs chatgpt-vps-control/tests/marketplace-install.test.js

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./chatgpt-vps-control/chrome-platform/extension/manifest.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version"

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build reproducible Chrome extension artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./chatgpt-vps-control/chrome-platform/extension/manifest.json').version")"
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          stage="$RUNNER_TEMP/fabushi-chrome-$version"
          rm -rf "$stage" dist verify
          mkdir -p "$stage" dist verify
          cp -a chatgpt-vps-control/chrome-platform/extension/. "$stage/"

          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const data = { schemaVersion: 1, sourceSha: process.argv[2], version: process.argv[3] };
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          ' "$stage/fabushi-build-provenance.json" "$source_sha" "$version"

          find "$stage" -exec touch -t 198001010000.00 {} +
          (
            cd "$stage"
            find . -type f ! -name 'fabushi-content-sha256.txt' -print0               | LC_ALL=C sort -z               | xargs -0 sha256sum > fabushi-content-sha256.txt
            find . -exec touch -t 198001010000.00 {} +
            find . -type f -print | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/dist/fabushi-chrome-$version.zip" -@
          )
          cp "$stage/fabushi-content-sha256.txt" "dist/fabushi-chrome-$version.content-sha256"
          (cd dist && sha256sum "fabushi-chrome-$version.zip" > "fabushi-chrome-$version.zip.sha256")

      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./chatgpt-vps-control/chrome-platform/extension/manifest.json').version")"
          unzip -q "dist/fabushi-chrome-$version.zip" -d verify
          test "$(node -p "require('./verify/manifest.json').version")" = "$version"
          test "$(node -p "require('./verify/fabushi-build-provenance.json').sourceSha")" = "${{ github.event.pull_request.head.sha || github.sha }}"
          (
            cd verify
            sha256sum -c fabushi-content-sha256.txt
          )
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find verify -type f -name '*.js' -print0)

      - name: Packaged Chrome Agent recovery E2E
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1
          command -v xvfb-run >/dev/null 2>&1
          xvfb-run -a node chatgpt-vps-control/tests/packaged-chrome-e2e.mjs verify

      - name: Upload exact-HEAD Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-chrome-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/fabushi-chrome-*.zip
            dist/fabushi-chrome-*.zip.sha256
            dist/fabushi-chrome-*.content-sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fabushi-chrome-*.zip
            dist/fabushi-chrome-*.zip.sha256
            dist/fabushi-chrome-*.content-sha256
